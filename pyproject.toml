[project]
name = "hiero-mcp"
version = "0.1.0"
description = "MCP server for Foundry Hiero / Nuke Studio 17"
readme = "README.md"
keywords = ["mcp", "hiero", "nuke", "nukestudio", "foundry", "vfx", "editorial"]
authors = [
    { name = "Toolbox Design" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3.0",
]

[project.scripts]
hiero-mcp = "hiero_mcp:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
